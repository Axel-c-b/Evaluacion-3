{% extends "base.html" %}
{% block title %}Crear cuenta · Red Pymes{% endblock %}

{% block content %}
  <div class="form-box form-box-narrow">
    <h2>Crear cuenta de usuario</h2>
    <p class="muted">Crea tu cuenta estándar para registrar tu pyme y publicar productos.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn" style="width: 100%;">Registrarme</button>
    </form>
    <p class="muted" style="margin-top: 1.2rem; text-align: center; font-size: 0.9rem;">
      ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a>
    </p>
  </div>
{% endblock %}
